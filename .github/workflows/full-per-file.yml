# Runs the full simulation in per-file mode on the demo/full-simulation PR. The
# shared concurrency group runs the two modes one after the other. The warm case
# is "Re-run all jobs" on this check at the same SHA.
name: full (per-file)

on:
  pull_request:
    branches: [main]

concurrency:
  group: full-pr

jobs:
  full:
    if: github.head_ref == 'demo/full-simulation'
    uses: ./.github/workflows/full.yml
    with:
      mode: per-file
    secrets: inherit
